<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Chatbot</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: #e5e7eb; /* light gray */
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.chat-box {
    width: 420px;
    height: 600px;
    background: white;
    border-radius: 15px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.messages {
    flex: 1;
    padding: 10px;
    overflow-y: auto;
    background: #f9fafb;
}

.input-box {
    display: flex;
    border-top: 1px solid #ddd;
}

input {
    flex: 1;
    padding: 12px;
    border: none;
    outline: none;
    background: #f3f4f6;
    color: black;
}

button {
    padding: 12px;
    border: none;
    background: #2563eb;
    color: white;
    cursor: pointer;
}

.user {
    text-align: right;
    margin: 5px;
    color: black;
}

.bot {
    text-align: left;
    margin: 5px;
    color: #2563eb;
}
</style>


</head>
<body>

<div class="chat-box">

    <div class="messages" id="messages"></div>

    <div class="input-box">
        <input id="msg" placeholder="Type message..." />
        <button onclick="sendMsg()">Send</button>
    </div>

</div>

<script>
const user_id = "1";

async function sendMsg() {
    let input = document.getElementById("msg");
    let message = input.value;
    if (!message) return;

    addMessage("user", message);

    input.value = "";

    let res = await fetch("http://127.0.0.1:8000/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            user_id: user_id,
            message: message
        })
    });

    let data = await res.json();
    addMessage("bot", data.response);
}

function addMessage(type, text) {
    let div = document.createElement("div");
    div.className = type;
    div.innerText = text;

    document.getElementById("messages").appendChild(div);

    let box = document.getElementById("messages");
    box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
