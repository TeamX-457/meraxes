services:
  llm-router:
    build: .
    ports:
      - "8020:8020"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
