<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meraxes</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/frontend/assets/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Tailwind configuration -->
    <!-- Please do not touch!!!! -->
    <style type="text/tailwindcss">
      @theme {
        --color-primary: #1e9df1;
        --color-primary-foreground: #ffffff;
        --color-secondary: #0f1419;
        --color-secondary-foreground: #ffffff;
        --color-accent-background: #e3ecf6;
        --color-accent-foreground: #1e9df1;
        --color-foreground: #000000;
        --color-background: #e7e9ea;
        --font-heading: "Canela", "Instrument Serif";
        --font-body: "Neue-Montreal", "Inter";
      }

      .dark {
        --color-background: #000000;
        --color-foreground: #e7e9ea;
        --color-primary: #1c9cf0;
        --color-accent-background: #061622;
        --color--accent-foreground: #1c9cf0;
        --color-primary-foreground: #ffffff;
        --color-secondary: #f0f3f4;
        --color-secondary-foreground: #0f1419;
        --font-heading: "Canela", "Instrument Serif";
        --font-body: "Inter";
      }
    </style>
  </head>
  <body>
    <!--
      Only put page-specific content here.
      The layout (aside + header) is injected by layout.js.
    -->
    <main class="bg-secondary-foreground p-12 min-w-full h-full">
      <h1 class="text-primary tracking-wider text-2xl font-heading font-bold">Embed on Website</h1>
        <P class="text-foreground font-body py-2">Paste the snippet before </body>. Your API must be reachable in position (try ngrok).</P>
        <div class="flex flex-col text-foreground border border-primary gap-1 rounded-2xl p-3">
          <h3>Bot</h3>
          <select class="border [&>option]:text-black focus:outline focus:outline-primary font-body border-primary w-[20%] p-0.5 rounded-2xl">
            <option value="">I'm bot 1</option>
            <option value="">I'm bot 2</option>
            <option value="">I'm bot 3</option>
            <option value="">I'm bot 4</option>
            <option value="">I'm bot 5</option>
          </select>
        </div>
    </main>

    <script src="/frontend/assets/index.js"></script>
    <script type="module">
      import { renderLayout } from "/frontend/assets/layout.js";

      renderLayout({
        title: "Chatbot Platform",
        subtitle: "Embed on any website",
        activeNav: "my-bots", // matches the `id` in layout.js NAV_ITEMS
      });
    </script>
  </body>
</html>
