<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meraxes</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <link rel="stylesheet" href="oga.css">
</head>
<body class="bg-[#0b1020] min-h-screen min-w-screen" >
<div class="max-w-7*1 mx-auto p-4 md:p-8 ">
    <!---heading--->
    <header class="bg-[#242844]/50 p-6 -mt-10 -mx-10 pl-10 border-1 border-white/50 ">
        <h1 class="text-white text-3xl font-bold">Chatbot Platform</h1>
        <h3 class="text-[cyan] font-bold m-0.5">Embed on any Website</h3>
    </header>
    <section class="mt-8 ">
        <h1 class="text-3xl text-white font-bold">Test Chat</h1>
        <h3 class="text-[cyan] font-bold m-0.5">Messages saved in platform for this browser session.</h3>
        <!---firstbox-->
        <div class="bg-[#1a1d2e] rounded-lg px-4 py-5 sm:w-full  text-white outline-none border-1 border-white/50 w-full">
           <h4 class="font-bold">Bot</h4>
        <div class="flex gap-20 ">
           <select class="font-inherit  border-1 border-white/60 rounded-lg w-lg line-height-1.6 cursor-pointer">
            <option value="select a bot">select a bot</option>
            <option>chat gpt</option>
           </select>
         <div class="flex gap-5">
           <button class="flex gap-5 bg-blue-500/10 px-3 rounded-full cursor-pointer"> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" class="size-4 mt-1 ">
  <path fill-rule="evenodd" d="M13.836 2.477a.75.75 0 0 1 .75.75v3.182a.75.75 0 0 1-.75.75h-3.182a.75.75 0 0 1 0-1.5h1.37l-.84-.841a4.5 4.5 0 0 0-7.08.932.75.75 0 0 1-1.3-.75 6 6 0 0 1 9.44-1.242l.842.84V3.227a.75.75 0 0 1 .75-.75Zm-.911 7.5A.75.75 0 0 1 13.199 11a6 6 0 0 1-9.44 1.241l-.84-.84v1.371a.75.75 0 0 1-1.5 0V9.591a.75.75 0 0 1 .75-.75H5.35a.75.75 0 0 1 0 1.5H3.98l.841.841a4.5 4.5 0 0 0 7.08-.932.75.75 0 0 1 1.025-.273Z" clip-rule="evenodd" />
</svg>
 Reload history</button>
           <button class="flex gap-3 bg-blue-500/10 px-3 rounded-full cursor-pointer"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-5 mt-1">
  <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
</svg>
 Clear chat</button>
         </div>
        </div>
           <p>user_id test-started</p>
        </div>
        <!---second box-->
        <div class="mt-6 h-[350px] bg-[#1a1d2e] rounded-lg text-center py-50 border-1 border-white/50 ">
            <h5 class="text-[cyan] font-bold">select a bot to sart chatting</h5>
        </div>
            <!--input-->
             <div class="bg-[#1a1d2e] mt-6 relative pt-20 pb-4 bottom-20 rounded-b-[20px] flex  gap-5 border-1 border-white/50 pt-[2%]">
              <input type="text" placeholder="Type a message..."class="text-[#1c9cf0] w-full bg-transparent border rounded-full border-[#4d567f]px-5 py-1.5 mx-3 text-white">
              <button class="px-4 mr-2 rounded-[20px] bg-blue-400 hover:scale-105 transition "><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="white" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M6 12 3.269 3.125A59.769 59.769 0 0 1 21.485 12 59.768 59.768 0 0 1 3.27 20.875L5.999 12Zm0 0h7.5" />
</svg>
</button>
             </div>
    </section>
</div>
</body>
</html>
